<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} · {{ site.title }}</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <script>location.replace("{{ page.redirect_to | relative_url }}");</script>
    <style>body{margin:0;background:#04050a;color:#8089a0;font:14px/1.6 ui-monospace,monospace;display:grid;place-items:center;min-height:100vh}a{color:#5ef2ff}</style>
</head>
<body>
    <p>This page has moved. <a href="{{ page.redirect_to | relative_url }}">Continue to {{ page.title }} →</a></p>
</body>
</html>
